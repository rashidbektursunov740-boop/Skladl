<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Склад стройматериалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18191A;
    --bg:#F1F1F1;
    --surface:#FFFFFF;
    --line:#EBEBEB;
    --muted:#8D8D93;
    --accent:#FFCC00;
    --accent-press:#E8B900;
    --accent-ink:#18191A;
    --in-color:#17A85A;
    --in-tint:#E4F8EC;
    --out-color:#F5372A;
    --out-tint:#FDE6E4;
    --radius-lg:20px;
    --radius-md:16px;
    --radius-sm:12px;
    --shadow:0 2px 14px rgba(24,25,26,0.07);
    --shadow-strong:0 6px 20px rgba(24,25,26,0.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3{
    font-family:'Unbounded',sans-serif;
    margin:0;
  }
  /* HEADER */
  header{
    padding:16px 14px 14px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:10;
  }
  header .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 12px;
  }
  header .brand h1{
    font-size:17px;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  header .brand small{
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  .search-box{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:0 14px;
    box-shadow:var(--shadow);
  }
  .search-box svg{flex-shrink:0;color:var(--muted);}
  .search-box input{
    border:none;
    background:transparent;
    outline:none;
    padding:14px 10px;
    font-size:14.5px;
    width:100%;
    font-family:inherit;
    font-weight:600;
    color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);font-weight:500;}
  select.sort-select{
    margin-top:10px;
    width:100%;
    background:var(--surface);
    border:none;
    border-radius:var(--radius-sm);
    padding:11px 12px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .filter-row{
    display:flex;
    gap:8px;
  }
  .chip{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:999px;
    background:var(--surface);
    border:none;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    box-shadow:var(--shadow);
  }
  .chip.active{
    background:var(--ink);
    color:var(--accent);
  }

  /* MAIN */
  main{
    flex:1;
    overflow-y:auto;
    padding:8px 14px 104px;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* MATERIAL ROW */
  .row-card{
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .row-card:active{background:#FAFAF9;}
  .row-card .info .name{
    font-weight:700;
    font-size:14.5px;
  }
  .row-card .info .code{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    font-weight:600;
  }
  .row-card .stock{
    text-align:right;
  }
  .row-card .stock .num{
    font-family:'Unbounded',sans-serif;
    font-size:17px;
    font-weight:700;
  }
  .row-card .stock.zero .num{color:var(--out-color);}
  .row-card .stock .unit{
    font-size:11px;
    color:var(--muted);
    font-weight:600;
  }

  /* HISTORY ROW */
  .hist-row{
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:var(--shadow);
  }
  .badge{
    font-size:11px;
    font-weight:700;
    padding:5px 10px;
    border-radius:999px;
    flex-shrink:0;
  }
  .badge.in{background:var(--in-tint);color:var(--in-color);}
  .badge.out{background:var(--out-tint);color:var(--out-color);}
  .hist-row .mid{flex:1;min-width:0;}
  .hist-row .mid .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-row .mid .meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
  .hist-row .qty{font-family:'Unbounded',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;}
  .hist-row .qty.in{color:var(--in-color);}
  .hist-row .qty.out{color:var(--out-color);}
  .trash-btn{
    border:none;background:var(--bg);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:7px;flex-shrink:0;border-radius:999px;
  }
  .trash-btn:active{color:var(--out-color);background:var(--out-tint);}

  /* EMPTY STATE */
  .empty{
    text-align:center;
    padding:56px 20px;
    color:var(--muted);
  }
  .empty h3{font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:700;}
  .empty p{font-size:13px;margin:0;font-weight:500;}

  /* STATS */
  .stats-search-results{margin-top:2px;}
  .stat-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:18px;
    margin-top:12px;
    box-shadow:var(--shadow);
  }
  .stat-card h2{font-size:16.5px;}
  .stat-card .code-line{font-size:12px;color:var(--muted);margin-top:3px;margin-bottom:14px;font-weight:600;}
  .stat-remain{
    background:var(--bg);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }
  .stat-remain .label{font-size:13px;color:var(--muted);font-weight:600;}
  .stat-remain .value{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;}
  .month-block{margin-bottom:12px;}
  .month-block .month-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:7px;
    text-transform:capitalize;
  }
  .month-stats{display:flex;gap:8px;}
  .month-stat{
    flex:1;
    border-radius:var(--radius-sm);
    padding:11px 10px;
    text-align:center;
  }
  .month-stat.in{background:var(--in-tint);}
  .month-stat.out{background:var(--out-tint);}
  .month-stat .n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;}
  .month-stat.in .n{color:var(--in-color);}
  .month-stat.out .n{color:var(--out-color);}
  .month-stat .l{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600;}

  .period-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .period-title{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .period-row{display:flex;gap:8px;align-items:flex-end;}
  .period-field{flex:1;}
  .period-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .period-field input{
    width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);
  }
  .period-go{
    width:44px;height:38px;border-radius:var(--radius-sm);background:var(--ink);color:var(--accent);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .period-result{margin-top:12px;}
  .period-result .month-title{text-transform:none;}

  .ops-title{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 4px 8px;}

  /* BOTTOM NAV */
  nav.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:520px;
    background:var(--surface);
    display:flex;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    border-radius:22px 22px 0 0;
    box-shadow:0 -4px 18px rgba(24,25,26,0.10);
    z-index:20;
    gap:4px;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    padding:6px 0 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:inherit;
    font-size:10.5px;
    font-weight:700;
    cursor:pointer;
  }
  nav.bottom button .nav-ico{
    width:38px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  }
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button.active .nav-ico{background:var(--accent);color:var(--ink);}

  /* FAB */
  .fab{
    position:fixed;
    right:16px;
    bottom:88px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--ink);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-strong);
    z-index:30;
    cursor:pointer;
  }
  .fab:active{background:var(--accent-press);}

  /* MODAL / SHEET */
  .overlay{
    position:fixed;inset:0;
    background:rgba(24,25,26,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:520px;
    border-radius:24px 24px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .drag-handle{
    width:40px;height:4px;background:var(--line);border-radius:999px;margin:6px auto 14px;
  }
  .sheet-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  }
  .sheet-head h2{font-size:17px;}
  .close-x{border:none;background:var(--bg);color:var(--muted);cursor:pointer;padding:7px;border-radius:999px;display:flex;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;
  }
  .field input,.field select{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    background:var(--bg);
    color:var(--ink);
    outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--accent);background:var(--surface);}
  .field-error{color:var(--out-color);font-size:12px;margin-top:5px;display:none;font-weight:600;}
  .btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:var(--radius-sm);
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:4px;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:active{background:var(--accent-press);}
  .btn-secondary{background:var(--bg);color:var(--ink);}
  .btn-danger{background:var(--out-color);color:#fff;}
  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn-row .btn{margin-top:0;}
  .action-grid{display:flex;gap:8px;margin:14px 0;}
  .action-grid button{
    flex:1;padding:15px 0;border-radius:var(--radius-sm);border:none;
    font-family:'Unbounded',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .action-grid .act-out{background:var(--ink);color:var(--accent);}
  .icon-row{display:flex;gap:8px;margin-top:4px;}
  .icon-row button{
    flex:1;padding:12px 0;border-radius:var(--radius-sm);border:none;
    background:var(--bg);color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .icon-row button.danger{color:var(--out-color);background:var(--out-tint);}
  .detail-stock{
    background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px;
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;
  }
  .detail-stock .value{font-family:'Unbounded',sans-serif;font-size:21px;font-weight:700;}

  /* TOAST */
  #toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--accent);padding:11px 20px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s ease;z-index:60;
    max-width:90%;text-align:center;box-shadow:var(--shadow-strong);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>Склад</h1>
      <button class="icon-btn" id="btn-refresh" aria-label="Обновить данные" style="width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
    <small id="tab-subtitle" style="display:block;margin:-8px 4px 12px;">стройматериалы</small>

    <!-- ДОМ (материалы) HEADER CONTROLS -->
    <div id="header-materials">
      <div class="search-row">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="mat-search" placeholder="Название или код" autocomplete="off">
        </div>
      </div>
      <select class="sort-select" id="mat-sort">
        <option value="name">Сортировка: по названию</option>
        <option value="code">Сортировка: по коду</option>
        <option value="stock-asc">Сначала мало на складе</option>
      </select>
    </div>

    <!-- ПРИХОД HEADER CONTROLS -->
    <div id="header-prihod" style="display:none;">
      <div class="search-row">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="prihod-search" placeholder="Название или код товара" autocomplete="off">
        </div>
      </div>
    </div>

    <!-- HISTORY HEADER CONTROLS -->
    <div id="header-history" style="display:none;">
      <div class="filter-row">
        <button class="chip active" data-hfilter="all">Все</button>
        <button class="chip" data-hfilter="in">Приход</button>
        <button class="chip" data-hfilter="out">Расход</button>
      </div>
    </div>

    <!-- STATS HEADER CONTROLS -->
    <div id="header-stats" style="display:none;">
      <div class="search-row">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="stats-search" placeholder="Найти товар для статистики" autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="view active" id="view-materials"></div>
    <div class="view" id="view-prihod"></div>
    <div class="view" id="view-history"></div>
    <div class="view" id="view-stats"></div>
  </main>

  <button class="fab" id="fab-add-material" style="display:none;" aria-label="Добавить материал">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="bottom">
    <button class="tab-btn active" data-tab="materials">
      <span class="nav-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-4.5v-6.5h-7V21H4a1 1 0 0 1-1-1V9.5z"/></svg></span>
      Дом
    </button>
    <button class="tab-btn" data-tab="prihod">
      <span class="nav-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg></span>
      Приход
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="nav-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
      Статистика
    </button>
    <button class="tab-btn" data-tab="history">
      <span class="nav-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
      История
    </button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast"></div>

<script>
// ---------- BACKEND (AMVERA) ----------
// ЗАМЕНИ на адрес своего приложения после деплоя на Amvera
const BACKEND_URL = "https://sklad-rasulbek0923.amvera.io";

async function apiGet(path){
  const res = await fetch(`${BACKEND_URL}/${path}`);
  if(!res.ok) throw new Error('get failed');
  return await res.json();
}
async function apiPost(path, data){
  const res = await fetch(`${BACKEND_URL}/${path}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('post failed');
}
async function apiPatch(path, data){
  const res = await fetch(`${BACKEND_URL}/${path}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('patch failed');
}
async function apiDelete(path){
  const res = await fetch(`${BACKEND_URL}/${path}`, { method:'DELETE' });
  if(!res.ok) throw new Error('delete failed');
}

// ---------- STATE ----------
let materials = [];
let operations = [];
let currentTab = 'materials';
let historyFilter = 'all';
let matSort = 'name';
let matQuery = '';
let statsQuery = '';
let selectedStatsId = null;
let prihodQuery = '';
let periodFrom = '';
let periodTo = '';

const UNITS = ['шт','мешок','м²','м³','м','кг','т','л','рулон','упаковка'];

// ---------- LOAD DATA ----------
let connectionError = false;
async function loadAll(){
  connectionError = false;
  try{
    materials = await apiGet('materials');
  }catch(e){ console.error(e); materials = []; connectionError = true; }
  try{
    const rows = await apiGet('operations');
    operations = rows.map(o=>({...o, qty: parseFloat(o.qty)||0}));
  }catch(e){ console.error(e); operations = []; connectionError = true; }
  switchTab(currentTab);
}
async function refreshAll(){
  showToast('Обновляю...');
  await loadAll();
  showToast('Данные обновлены');
}

function uid(){
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

function stockOf(materialId){
